[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnosis-forge"
version = "0.0.1"
description = "Local AI agent that explains why a business metric changed, with checked evidence, plus a benchmark with planted causes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
diagnosis-forge = "diagnosis_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
